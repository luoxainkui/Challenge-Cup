server {
    listen 80;
    server_name 8.163.85.243;

    root /var/www/guishengtong;
    index index.html;

    # Vue History 路由：所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源强缓存（文件名带 hash，长缓存安全）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML 禁止缓存，避免旧页面卡住
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # favicon
    location = /favicon.svg {
        expires 30d;
    }
}